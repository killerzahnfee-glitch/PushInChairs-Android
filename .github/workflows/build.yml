name: Build Android SMAPI mod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Add Stardew Valley reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1
      - name: Compile
        run: dotnet build PushInChairs/PushInChairs.csproj -c Release
      - name: Package
        shell: bash
        run: |
          mkdir -p package/PushInChairs
          cp PushInChairs/manifest.json package/PushInChairs/
          find PushInChairs/bin/Release -name PushInChairs.dll -exec cp {} package/PushInChairs/ \;
          test -s package/PushInChairs/PushInChairs.dll
          cd package && zip -r ../PushInChairs-Android.zip PushInChairs
      - uses: actions/upload-artifact@v4
        with:
          name: PushInChairs-Android
          path: PushInChairs-Android.zip